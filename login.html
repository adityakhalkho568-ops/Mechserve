<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | MechServe</title>

<link rel="stylesheet"
href="css/style.css">

</head>

<body class="auth-page">


<div class="auth-box">

<a href="index.html"
class="auth-logo">

⚙️ Mech<span>Serve</span>

</a>


<h1>
Welcome Back
</h1>

<p>
Login to your MechServe account.
</p>


<form onsubmit="loginUser(event)">

<label>
Email

<input
type="email"
required
placeholder="you@example.com"
>

</label>


<label>
Password

<input
type="password"
required
placeholder="••••••••"
>

</label>


<div class="remember">

<label>

<input type="checkbox">

Remember me

</label>

<a href="#">
Forgot Password?
</a>

</div>


<button class="btn full">
Login
</button>


</form>


<div class="auth-divider">
OR
</div>


<p class="register-text">

Don't have an account?

<a href="register.html">
Create Account
</a>

</p>


<p class="demo-login">

Demo Admin:
admin@mechserve.com

</p>

</div>


<script src="js/script.js"></script>

</body>

</html>
